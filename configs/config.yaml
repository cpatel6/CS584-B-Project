project_name: "SentimentAnalysisDomainShift"
seed: 42

data:
  in_domain: "amazon_polarity" # using HF datasets for Amazon Reviews
  out_of_domain: "imdb"        # using HF datasets for IMDb Reviews
  text_column: "text"
  label_column: "label"
  max_seq_length: 64           # reduced from 256 – saves memory for neural models
  train_samples: 500           # reduced from 1000 – faster training on laptop
  test_samples: 100            # reduced from 300
  ood_samples: 200             # reduced from 500
  val_split: 0.1

preprocessing:
  lowercase: true
  remove_punctuation: true
  remove_stopwords: true
  max_features_tfidf: 5000     # reduced from 10000 – cuts TF-IDF matrix memory in half
  ngram_range: [1, 2]

training:
  batch_size: 16               # reduced from 32 – lower peak RAM during neural training
  learning_rate_nn: 1e-3
  learning_rate_tf: 2e-5
  epochs: 1                    # reduced from 2 – single pass is enough for a demo run
  early_stopping_patience: 2
  device: "cpu"
  save_checkpoints: false      # set true to persist model .pkl files (uses ~50–200 MB)
  vocab_size_nn: 5000          # vocabulary size for CNN/BiLSTM; reduced from 10000

models:
  statistical:
    - "tfidf_lr"
    - "ngrams_svm"
    - "glove_lr"
  neural:
    - "cnn_glove"
    - "bilstm_glove"
    - "distilbert"

robustness:
  noise_levels: [0.05, 0.15]   # reduced from 3 to 2 levels
  data_regimes: [0.1, 1.0]     # reduced from 4 to 2 fractions

paths:
  data_dir: "data"
  outputs_dir: "outputs"
  models_dir: "outputs/models"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
  reports_dir: "reports"
