project_name: "SentimentAnalysisDomainShift"
seed: 42

data:
  in_domain: "amazon_polarity" # using HF datasets for Amazon Reviews
  out_of_domain: "imdb"        # using HF datasets for IMDb Reviews
  text_column: "text"
  label_column: "label"
  max_seq_length: 256
  train_samples: 12000 # 12,000 for training/validation
  test_samples: 3000   # 3,000 for internal in-domain testing
  ood_samples: 15000   # 15,000 for out-of-domain evaluation (IMDb)
  val_split: 0.1

preprocessing:
  lowercase: true
  remove_punctuation: true
  remove_stopwords: true
  max_features_tfidf: 10000
  ngram_range: [1, 2]

training:
  batch_size: 32
  learning_rate_nn: 1e-3
  learning_rate_tf: 2e-5
  epochs: 5
  early_stopping_patience: 2
  device: "cuda"

models:
  statistical:
    - "tfidf_lr"
    - "ngrams_svm"
    - "glove_lr"
  neural:
    - "cnn_glove"
    - "bilstm_glove"
    - "distilbert"

robustness:
  noise_levels: [0.05, 0.1, 0.15]
  data_regimes: [0.01, 0.05, 0.1, 1.0]

paths:
  data_dir: "data"
  outputs_dir: "outputs"
  models_dir: "outputs/models"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
  reports_dir: "reports"
